<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Video Comment Analyser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root { --bg-dark: #0f172a; --accent: #3bf1f7; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; overflow-x: hidden; }
        .main-wrapper { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at top right, #1e293b, #0f172a); padding: 20px; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 60px; width: 100%; max-width: 900px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .form-control { background: rgba(255, 255, 255, 0.1) !important; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 18px; color: white !important; font-size: 1.2rem; }
        .btn-analyze { background: var(--accent); border: none; border-radius: 15px; padding: 18px; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .btn-analyze:hover { background: #326be6; transform: translateY(-2px); }
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
        .history-item { background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 12px 20px; margin-bottom: 8px; transition: 0.2s; border: 1px solid transparent; width: 100%; text-align: left; color: white; }
        .history-item:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--accent); }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;"></div>
        <h4 class="animate__animated animate__pulse animate__infinite">Analysing Comments...</h4>
    </div>

    <div class="main-wrapper">
        <div class="glass-panel animate__animated animate__fadeIn">
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold mb-3">Youtube Video <span class="text-primary">Comment Analyser</span></h1>
                <p class="lead text-white-50">Deep sentiment insights and visual word clouds for any video.</p>
            </div>

            {% if error %}<div class="alert alert-danger bg-danger text-white border-0 rounded-4 mb-4">{{ error }}</div>{% endif %}

            <form action="/analyze" method="post" onsubmit="document.getElementById('loader').style.display='flex'">
                <div class="mb-4">
                    <input type="text" class="form-control" name="video_url" placeholder="Paste YouTube URL here..." required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-analyze btn-primary">Start AI Analysis</button>
                </div>
            </form>

            {% if history %}
            <div class="mt-5 pt-4 border-top border-secondary">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="text-uppercase small fw-bold opacity-50">Recent History</h6>
                    <a href="/clear_history" class="text-white-50 small text-decoration-none">Clear History</a>
                </div>
                {% for item in history %}
                <form action="/analyze" method="post" onsubmit="document.getElementById('loader').style.display='flex'">
                    <input type="hidden" name="video_url" value="{{ item.url }}">
                    <button type="submit" class="history-item border-0 d-flex justify-content-between">
                        <span class="text-truncate">{{ item.title }}</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
